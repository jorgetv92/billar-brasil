<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f7">
    <title>Administración · Billar Brasil</title>
    <script src="js/tema.js?v=2026111501"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..0&display=block" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=2026111501">
    <link rel="icon" type="image/png" href="assets/logo_icono.png">
</head>

<body>

    <header class="appbar">
        <div class="appbar-left">
            <button id="menuToggle" class="icon-btn" title="Mostrar u ocultar el menú" aria-label="Mostrar u ocultar el menú"><i class="material-icons">side_navigation</i></button>
            <div class="brand">
                <img src="assets/logo_icono.png" alt="" class="brand-logo">
                <div class="brand-text">
                    <span class="brand-name">Billar Brasil</span>
                    <span class="brand-sub">Resto Bar</span>
                </div>
            </div>
        </div>
    </header>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-profile">
            <div class="avatar"><i class="material-icons is-fill">person</i></div>
            <div class="sidebar-profile-texto">
                <h3 id="sidebarUserName">Cargando...</h3>
                <span class="role-badge">Admin</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active" data-page="dashboard.html">
                <i class="material-icons">space_dashboard</i> Dashboard
            </button>
            <button class="nav-item" data-page="tipos_mesa.html">
                <i class="material-icons">category</i> Tipos de Mesas
            </button>
            <button class="nav-item" data-page="mesas.html">
                <i class="material-icons">table_restaurant</i> Mesas Físicas
            </button>
            <button class="nav-item" data-page="productos.html">
                <i class="material-icons">inventory_2</i> Inventario
            </button>
            <button class="nav-item" data-page="combos.html">
                <i class="material-icons">fastfood</i> Combos
            </button>
            <button class="nav-item" data-page="insumos.html">
                <i class="material-icons">cleaning_services</i> Insumos
            </button>
            <button class="nav-item" data-page="promociones.html">
                <i class="material-icons">sell</i> Promociones
            </button>
            <button class="nav-item" data-page="cargos.html">
                <i class="material-icons">report</i> Conceptos de Cargo
            </button>
            <button class="nav-item" data-page="usuarios.html">
                <i class="material-icons">group</i> Usuarios
            </button>
            <button class="nav-item" data-page="cargas_mercaderia.html">
                <i class="material-icons">local_shipping</i> Carga de Mercadería
            </button>
            <button class="nav-item" data-page="cargas_insumos.html">
                <i class="material-icons">add_box</i> Carga de Insumos
            </button>
            <button class="nav-item" data-page="gastos_productos.html">
                <i class="material-icons">liquor</i> Gasto de Productos
            </button>
            <button class="nav-item" data-page="reportes.html">
                <i class="material-icons">analytics</i> Reportes
            </button>
            <div class="nav-divider"></div>
            <button class="nav-item text-danger" id="btnLogout">
                <i class="material-icons">logout</i> Cerrar Sesión
            </button>
        </nav>
        <div class="sidebar-pie">
            <span class="sidebar-pie-titulo" id="tituloApariencia">Apariencia</span>
            <div class="selector-tema" role="group" aria-labelledby="tituloApariencia">
                <button type="button" data-tema-opcion="claro" title="Apariencia clara"><i class="material-icons">light_mode</i>Claro</button>
                <button type="button" data-tema-opcion="oscuro" title="Apariencia oscura"><i class="material-icons">dark_mode</i>Oscuro</button>
                <button type="button" data-tema-opcion="auto" title="Sigue la apariencia del sistema"><i class="material-icons">contrast</i>Auto</button>
            </div>
        </div>
    </aside>

    <main id="router-outlet" class="main-content">
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <!-- ============================================================ -->
    <!-- MODAL: LISTADO ÚLTIMOS CIERRES DE JORNADA                   -->
    <!-- ============================================================ -->
    <div id="modalListadoCierres" class="hoja-fondo" style="display:none;">
        <div class="hoja">
            <div class="hoja-header">
                <span class="hoja-icono tono-azul"><i class="material-icons">history</i></span>
                <div class="hoja-titulos">
                    <h3>Últimos Cierres de Jornada</h3>
                    <p>Historial de los últimos 10 reportes definitivos en PDF</p>
                </div>
                <button class="boton-cerrar" title="Cerrar" aria-label="Cerrar" onclick="document.getElementById('modalListadoCierres').style.display='none'">
                    <i class="material-icons">close</i>
                </button>
            </div>
            <div id="listadoPdfsAdmin" class="hoja-body lista-pdfs">
                <p class="texto-suave texto-centro">Cargando reportes...</p>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- MODAL FULLSCREEN: VISOR DE PDF                              -->
    <!-- ============================================================ -->
    <div id="modalPdfFullscreen" class="visor-pdf" style="display:none;">
        <div class="visor-pdf-barra">
            <div class="visor-pdf-titulo">
                <i class="material-icons">picture_as_pdf</i>
                <span id="tituloModalPdfAdmin">Reporte PDF</span>
            </div>

            <div class="visor-pdf-centro">
                <a id="btnAbrirExternoPdfAdmin" href="#" target="_blank" class="btn-primary btn-sm">
                    <i class="material-icons">open_in_new</i> Abrir / Descargar
                </a>
            </div>

            <div class="visor-pdf-derecha">
                <button id="btnCerrarVisorPdf" class="btn-vidrio btn-sm" onclick="window.cerrarVisorPdfAdmin()">
                    <i class="material-icons">arrow_back</i> Volver al listado
                </button>
            </div>
        </div>
        <iframe id="iframePdfAdmin" src="" title="Reporte PDF"></iframe>
    </div>

    <script src="js/fechas.js?v=2026111101"></script>
    <script src="js/selectores.js?v=2026111401"></script>
    <script src="js/admin.js?v=2026111401"></script>
</body>

</html>
